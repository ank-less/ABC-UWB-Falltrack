# Baseline pipeline for UWB-FallTrack (ABC 2027).
# Relative paths are resolved from the directory the command is run in (the repo root).
# "confirmed" = read from the dataset package README/evaluator or from the HDF5 files (2026-10-22).
# "provisional" = team choice, not part of the official protocol.

data:
  root: data/uwb_falltrack/abc2027_uwb_train_v1
  streams_dir: streams                   # confirmed: streams/<split>/stream_XX.h5
  events_csv: streams_events.csv         # confirmed: 478 fall events, train + val only
  composition_csv: streams_composition.csv  # confirmed: source segments of every train/val stream
  manifest_path: outputs/manifest/manifest.csv
  segments_path: outputs/manifest/segments.csv
  include_splits: [train, val]           # official test streams are not in the package
  rate_hz: 50.0                          # confirmed: README + diff(t) = 0.02 s
  expected_radars: 3                     # confirmed: serials 29171, 29444, 30722
  expected_bins: 368                     # confirmed: CIR range bins
  chunk_frames: 5000                     # matches the HDF5 chunk shape (3, 5000, 368)
  official_split_field: official_split
  recording_field: stream_id
  group_field: subject_group             # derived from composition paths, see docs/baseline_pipeline.md

validation:
  strict: true                 # errors stop the pipeline; warnings are logged
  check_timestamps: true
  check_missing: true          # count NaN/Inf while streaming the CIR
  check_split_overlap: true
  timestamp_tolerance_s: 1.0e-6

split:
  strategy: official           # confirmed: train/val/test use different subjects
  holdout_split: val           # only used for the final report, never for fitting or tuning
  group_key: subject_group     # CV inside train is grouped by source subject, not by stream
  n_folds: 3
  seed: 2027

preprocessing:
  background_tau_seconds: 3.0  # causal EMA background removal, same idea as the official baseline

windowing:
  duration_seconds: 1.0        # provisional: falls last 0.48-5.0 s (median 1.74 s)
  stride_seconds: 0.2          # provisional
  minimum_valid_fraction: 1.0  # fraction of finite frames required in a window
  drop_last: true              # no padding at the end of a stream
  positive_overlap_threshold: 0.5   # positive if overlap / min(window, fall) >= this
  negative_overlap_max: 0.0         # negative only if the window does not touch any fall
  drop_ambiguous: true              # windows in between are left out of training
  flagged_event_policy: positive    # quality=low / needs_review falls: positive | ambiguous

features:
  representation: motion_energy     # per-frame energies after background removal, no raw CIR
  series: [bg_energy, diff_energy]  # optional: range_centroid (encodes location, see docs)
  log_transform: true
  enabled_features: [mean, std, min, max, median, q25, q75, iqr, rms, slope, max_abs_diff, peak_to_median]
  cross_radar: true                 # max/mean over radars of the window mean and max
  context_seconds: 5.0              # causal contrast: window mean minus the preceding 5 s mean

model:
  candidates:
    - name: dummy
    - name: logistic
      parameters:
        C: [0.1, 1.0]
    - name: hist_gradient_boosting
      parameters:
        max_iter: [200]
        learning_rate: [0.1]
        max_leaf_nodes: [31]
  class_weight: balanced

threshold:
  selection_metric: official_f1_mean   # mean event F1 at theta 0.1/0.3/0.5, on out-of-fold train scores
  candidate_values: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95]

postprocessing:                    # every list is a grid tuned on out-of-fold train scores only
  smoothing_windows: [1, 3]
  minimum_positive_windows: [1, 2]
  merge_gap_seconds: [0.2, 0.6]
  minimum_event_duration_seconds: [0.4, 0.8]
  cooldown_seconds: [0.0]
  interval_mode: center            # event = [first centre - stride/2, last centre + stride/2]

evaluation:
  official_evaluator: data/uwb_falltrack/abc2027_uwb_train_v1/src/abc2027/evaluate.py
  ignore_flagged: true             # confirmed: makes validation follow the official test rule
  report_by_group: true

diagnostics:
  learning_curve_fractions: [0.5, 1.0]
  junction_margin_seconds: 0.5     # join zone = [join - margin, join + after]
  junction_after_seconds: 3.0      # the background residual decays for about tau after a join
  suspicious_score: 0.95           # f1_mean above this triggers a leakage warning

experiment:
  name: baseline
  seed: 2027
  output_root: outputs/experiments
  cache_dir: outputs/cache
  max_streams_per_split: null      # null = all streams
  max_seconds_per_stream: null
  smoke:                           # applied with --smoke
    max_streams_per_split: 2
    max_seconds_per_stream: 300
