[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abc-uwb-falltrack"
version = "0.1.0"
description = "Team workspace for continuous fall detection in UWB radar streams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "h5py>=3.11",
]
notebook = ["jupyterlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]
