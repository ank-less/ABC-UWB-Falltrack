[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abc-uwb-falltrack"
version = "0.1.0"
description = "Team workspace for continuous fall detection in UWB radar streams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "h5py>=3.10",
    "PyYAML>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
]
notebook = ["jupyterlab>=4.0", "matplotlib>=3.8"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
